<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 Bucket Explorer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #333; }
        .controls { margin-bottom: 20px; padding: 15px; background: #f7f7f7; border-radius: 5px; }
        input, button, select { padding: 8px; margin-right: 10px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #45a049; }
        .file-list { border: 1px solid #ddd; padding: 0; border-radius: 4px; overflow: hidden; }
        .file-item { padding: 10px 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background-color: #f1f1f1; }
        .file-name { flex: 1; }
        .file-size { color: #666; margin-right: 15px; }
        .file-date { color: #666; width: 200px; text-align: right; }
        .breadcrumb { margin-bottom: 15px; }
        .breadcrumb a { color: #4CAF50; text-decoration: none; margin: 0 5px; }
        .breadcrumb a:hover { text-decoration: underline; }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { display: flex; align-items: center; }
        .spinner { width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #4CAF50; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .path-input { display: flex; width: 100%; margin-bottom: 10px; }
        .path-input input { flex: 1; }
        .hidden { display: none; }
    </style>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1001.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>S3 Bucket Explorer</h1>
        
        <div class="controls">
            <div class="path-input">
                <input type="text" id="prefixInput" placeholder="Path prefix (e.g., recordings/)">
                <button id="browseBtn">Browse</button>
            </div>
            
            <div>
                <label for="modeSelect">Display mode:</label>
                <select id="modeSelect">
                    <option value="all">All Files</option>
                    <option value="mp3" selected>MP3 Files Only</option>
                    <option value="folders">Folders Only</option>
                </select>
                <button id="refreshBtn">Refresh</button>
            </div>
        </div>
        
        <div id="statusMessage" class="status hidden"></div>
        
        <div id="loadingIndicator" class="loading hidden">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
        
        <div class="breadcrumb" id="breadcrumb">
            <a href="#" data-prefix="">Root</a>
        </div>
        
        <div class="file-list" id="fileList"></div>
    </div>
    
    <script src="js/config.js"></script>
    <script>
        // References to DOM elements
        const prefixInput = document.getElementById('prefixInput');
        const browseBtn = document.getElementById('browseBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const modeSelect = document.getElementById('modeSelect');
        const fileList = document.getElementById('fileList');
        const breadcrumb = document.getElementById('breadcrumb');
        const statusMessage = document.getElementById('statusMessage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        
        // Current state
        let currentPrefix = '';
        
        // Initialize AWS SDK
        AWS.config.region = config.region;
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: config.identityPoolId
        });
        
        // Initialize S3 client with the options from config
        const s3 = new AWS.S3(config.s3Options || {});
        
        // Show status message
        function showStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = `status ${isError ? 'error' : 'success'}`;
            statusMessage.classList.remove('hidden');
            setTimeout(() => statusMessage.classList.add('hidden'), 5000);
        }
        
        // Show/hide loading indicator
        function setLoading(isLoading) {
            loadingIndicator.classList.toggle('hidden', !isLoading);
        }
        
        // Format file size
        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // Format date
        function formatDate(date) {
            return new Date(date).toLocaleString();
        }
        
        // List objects in the bucket with the current prefix
        async function listObjects() {
            setLoading(true);
            try {
                // Ensure credentials are refreshed
                await new Promise((resolve, reject) => {
                    AWS.config.credentials.refresh(err => {
                        if (err) reject(err);
                        else resolve();
                    });
                });
                
                const params = {
                    Bucket: config.bucketName,
                    Prefix: currentPrefix,
                    Delimiter: '/'
                };
                
                console.log('Listing objects with params:', params);
                
                const data = await s3.listObjectsV2(params).promise();
                
                console.log('List results:', data);
                
                // Clear the file list
                fileList.innerHTML = '';
                
                // Update breadcrumb
                updateBreadcrumb();
                
                // Process folders (CommonPrefixes)
                if (data.CommonPrefixes && (modeSelect.value === 'all' || modeSelect.value === 'folders')) {
                    data.CommonPrefixes.forEach(prefix => {
                        const folderName = prefix.Prefix.replace(currentPrefix, '').replace(/\/$/, '');
                        
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.innerHTML = `
                            <div class="file-name">📁 ${folderName}/</div>
                            <div class="file-size">Folder</div>
                            <div class="file-date"></div>
                        `;
                        
                        item.addEventListener('click', () => {
                            currentPrefix = prefix.Prefix;
                            prefixInput.value = currentPrefix;
                            listObjects();
                        });
                        
                        fileList.appendChild(item);
                    });
                }
                
                // Process files (Contents)
                if (data.Contents) {
                    const filteredContents = data.Contents.filter(item => {
                        // Skip the current directory item
                        if (item.Key === currentPrefix) return false;
                        
                        // Filter based on selected mode
                        if (modeSelect.value === 'mp3' && !item.Key.endsWith('.mp3')) return false;
                        if (modeSelect.value === 'folders') return false;
                        
                        // Skip items that would be considered part of a CommonPrefix
                        const relativePath = item.Key.substring(currentPrefix.length);
                        return !relativePath.includes('/');
                    });
                    
                    if (filteredContents.length === 0) {
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.innerHTML = '<div class="file-name">No files found</div>';
                        fileList.appendChild(item);
                    } else {
                        filteredContents.forEach(file => {
                            const fileName = file.Key.substring(currentPrefix.length);
                            
                            const item = document.createElement('div');
                            item.className = 'file-item';
                            item.innerHTML = `
                                <div class="file-name">📄 ${fileName}</div>
                                <div class="file-size">${formatSize(file.Size)}</div>
                                <div class="file-date">${formatDate(file.LastModified)}</div>
                            `;
                            
                            fileList.appendChild(item);
                        });
                    }
                } else if (fileList.childElementCount === 0) {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = '<div class="file-name">No files found</div>';
                    fileList.appendChild(item);
                }
                
                showStatus(`Successfully listed contents of ${config.bucketName}/${currentPrefix}`);
            } catch (error) {
                console.error('Error listing objects:', error);
                showStatus(`Error: ${error.message}`, true);
            } finally {
                setLoading(false);
            }
        }
        
        // Update the breadcrumb navigation
        function updateBreadcrumb() {
            breadcrumb.innerHTML = '<a href="#" data-prefix="">Root</a>';
            
            if (currentPrefix) {
                let path = '';
                const parts = currentPrefix.split('/').filter(Boolean);
                
                parts.forEach((part, index) => {
                    path += part + '/';
                    breadcrumb.innerHTML += ` / <a href="#" data-prefix="${path}">${part}</a>`;
                });
            }
            
            // Add click events to breadcrumb links
            document.querySelectorAll('#breadcrumb a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPrefix = link.getAttribute('data-prefix');
                    prefixInput.value = currentPrefix;
                    listObjects();
                });
            });
        }
        
        // Event listeners
        browseBtn.addEventListener('click', () => {
            currentPrefix = prefixInput.value;
            listObjects();
        });
        
        refreshBtn.addEventListener('click', () => {
            listObjects();
        });
        
        modeSelect.addEventListener('change', () => {
            listObjects();
        });
        
        prefixInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentPrefix = prefixInput.value;
                listObjects();
            }
        });
        
        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Bucket Explorer initialized');
            console.log('Using AWS config:', config);
            
            // Start with recordings prefix if available
            if (config.recordingsPrefix) {
                currentPrefix = config.recordingsPrefix;
                prefixInput.value = currentPrefix;
            }
            
            listObjects();
        });
    </script>
</body>
</html>
