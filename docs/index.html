<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPKN Radio Archive</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1001.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <!-- Using Feather icons instead of Lucide to avoid conflicts -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
    <!-- Fixed Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">WPKN</a>
            </div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search recordings...">
                <i data-feather="search" class="search-icon"></i>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-link">Archive</a>
                <a href="#" class="nav-link">About</a>
                <select id="sortSelect" class="nav-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Radio Archive</h1>
            <p class="subtitle">Listen. Explore. Repeat.</p>
        </div>
    </section>

    <div class="container">
        <!-- Loading & Error Indicators -->
        <div id="loadingIndicator" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading recordings...</p>
        </div>

        <div id="errorMessage" class="error hidden"></div>

        <!-- Show Grid -->
        <div class="shows-heading">
            <h2>Recent Shows</h2>
        </div>
        <div class="show-grid" id="showGrid">
            <!-- Shows will be dynamically inserted here -->
        </div>
    </div>

    <!-- Fixed Bottom Player -->
    <div class="player-container" id="playerContainer">
        <div id="player" class="audio-player">
            <div class="player-now-playing">
                <div class="now-playing-text">
                    <span class="now-playing-label">Now Playing:</span>
                    <span id="nowPlayingText" class="track-title">No track selected</span>
                </div>
            </div>
            
            <div class="player-controls">
                <button id="playPauseBtn" class="control-btn play-btn" aria-label="Play">
                    <i data-feather="play" class="play-icon"></i>
                </button>
                
                <div class="progress-container">
                    <span id="currentTime" class="time">0:00</span>
                    <div id="progressBar" class="progress-bar">
                        <div id="progress" class="progress"></div>
                    </div>
                    <span id="duration" class="time">0:00</span>
                </div>
                
                <div class="volume-container">
                    <button id="muteBtn" class="control-btn volume-btn" aria-label="Mute">
                        <i data-feather="volume-2" class="volume-icon"></i>
                    </button>
                    <input type="range" id="volumeSlider" min="0" max="100" value="100" aria-label="Volume">
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Initialize Feather Icons
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
        });
    </script>
</body>
</html>
