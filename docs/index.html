<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPKN Radio Archive</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1001.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>WPKN Radio Archive</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search recordings...">
                <select id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
        </header>

        <main>
            <div id="loadingIndicator" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading recordings...</p>
            </div>

            <div id="errorMessage" class="error hidden"></div>

            <div class="playlist-container">
                <ul id="playlist" class="playlist"></ul>
            </div>

            <div class="player-container">
                <div id="player" class="audio-player">
                    <div class="player-controls">
                        <button id="playPauseBtn" class="control-btn">Play</button>
                        <div class="progress-container">
                            <div id="progressBar" class="progress-bar">
                                <div id="progress" class="progress"></div>
                            </div>
                            <span id="currentTime" class="time">0:00</span>
                            <span id="duration" class="time">0:00</span>
                        </div>
                        <div class="volume-container">
                            <button id="muteBtn" class="control-btn">🔊</button>
                            <input type="range" id="volumeSlider" min="0" max="100" value="100">
                        </div>
                    </div>
                    <div class="now-playing">
                        <span>Now Playing:</span>
                        <span id="nowPlayingText">No track selected</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by WPKN Radio Archive System</p>
        </footer>
    </div>

    <!-- Make sure these script references are correct -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
