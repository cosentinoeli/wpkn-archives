<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WPKN Radio Archives</title>
    <link rel="stylesheet" href="styles.css?v=1.2">
</head>
<body>
    <!-- Main Container -->
    <div class="winamp-container">
        <!-- Top Section -->
        <div class="top-section">
            <!-- Player Window -->
            <div class="player-window">
                <div class="window-title">
                    <span class="title-text">*** WPKN RADIO ARCHIVES ***</span>
                    <div class="window-controls">
                        <button class="window-btn">_</button>
                        <button class="window-btn">□</button>
                        <button class="window-btn">×</button>
                    </div>
                </div>
                
                <!-- Time Display -->
                <div class="time-display">
                    <div class="digit-display">
                        <span id="currentTime">0:00</span>
                    </div>
                    <div class="kbps-khz">
                        <div id="bitrate">128</div>
                        <div id="samplerate">44</div>
                    </div>
                </div>
                
                <!-- Track Info -->
                <div class="track-info">
                    <div class="track-title-scroll">
                        <span id="trackTitle">WPKN Radio Archives - Select a recording to play</span>
                    </div>
                </div>
                
                <!-- Visualization -->
                <div class="visualizer">
                    <canvas id="waveform" width="276" height="60"></canvas>
                </div>
                
                <!-- Progress Bar -->
                <div class="progress-bar-container">
                    <input type="range" id="progressBar" min="0" max="100" value="0" class="progress-bar">
                    <div class="progress-time">
                        <span id="elapsed">0:00</span>
                        <span id="total">0:00</span>
                    </div>
                </div>
                
                <!-- Controls -->
                <div class="controls">
                    <button id="prevBtn" class="control-btn" title="Previous">⏮</button>
                    <button id="playBtn" class="control-btn play" title="Play">▶</button>
                    <button id="pauseBtn" class="control-btn" title="Pause">⏸</button>
                    <button id="stopBtn" class="control-btn" title="Stop">⏹</button>
                    <button id="nextBtn" class="control-btn" title="Next">⏭</button>
                    
                    <div class="volume-control">
                        <span class="volume-icon">🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
                    </div>
                </div>
            </div>
            
            <!-- Schedule Window -->
            <div class="schedule-window">
                <div class="window-title">
                    <span class="title-text">*** SCHEDULE ***</span>
                </div>
                
                <div class="schedule-controls">
                    <label for="scheduleDate">Date:</label>
                    <input type="date" id="scheduleDate" class="date-picker">
                    <button id="todayBtn" class="small-btn">Today</button>
                </div>
                
                <div class="schedule-list-container">
                    <div class="schedule-header">
                        <span class="col-time">TIME</span>
                        <span class="col-show">SHOW</span>
                        <span class="col-duration">LENGTH</span>
                    </div>
                    <div id="scheduleList" class="schedule-list">
                        <!-- Schedule items will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Section - Library -->
        <div class="library-window">
            <div class="window-title">
                <span class="title-text">*** MEDIA LIBRARY ***</span>
            </div>
            
            <div class="library-content">
                <!-- Left Panel - Shows List -->
                <div class="shows-panel">
                    <div class="panel-header">
                        <span>SHOWS</span>
                    </div>
                    <div class="search-box">
                        <input type="text" id="showSearch" placeholder="Search shows..." class="search-input">
                    </div>
                    <div id="showsList" class="shows-list">
                        <!-- Shows will be inserted here -->
                    </div>
                </div>
                
                <!-- Right Panel - Recordings List -->
                <div class="recordings-panel">
                    <div class="panel-header">
                        <span id="selectedShowName">SELECT A SHOW</span>
                    </div>
                    <div class="recordings-list-container">
                        <div class="recordings-header">
                            <span class="col-date">DATE</span>
                            <span class="col-title">RECORDING</span>
                            <span class="col-dur">DURATION</span>
                            <span class="col-size">SIZE</span>
                        </div>
                        <div id="recordingsList" class="recordings-list">
                            <!-- Recordings will be inserted here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loading Indicator -->
    <div id="loading" class="loading hidden">
        <div class="loading-box">
            <div class="loading-text">LOADING...</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>
    
    <audio id="audioPlayer" preload="metadata"></audio>
    
    <script src="config.js?v=1.2"></script>
    <script src="app.js?v=1.2"></script>
</body>
</html>
