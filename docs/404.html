<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | WPKN Radio Archive</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-container {
            text-align: center;
            padding: 50px 20px;
        }
        .error-code {
            font-size: 72px;
            margin: 0;
            color: #3498db;
        }
        .error-message {
            font-size: 24px;
            margin: 20px 0;
        }
        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container">
            <h1 class="error-code">404</h1>
            <p class="error-message">Page not found</p>
            <p>The page you're looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="back-button">Go to Home Page</a>
        </div>
    </div>
    <script>
        // Redirect to home page if this is likely a routing issue
        if (window.location.pathname.startsWith('/wpkn-archives/') && 
            !window.location.pathname.endsWith('404.html')) {
            window.location.href = '/wpkn-archives/';
        }
    </script>
</body>
</html>
