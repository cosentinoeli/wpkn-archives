<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; }
        .log { background: #f4f4f4; padding: 10px; border-radius: 4px; margin-bottom: 10px; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1001.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>AWS Connection Test</h1>
        <button id="testCredentials">Test AWS Credentials</button>
        <button id="testS3">Test S3 Connection</button>
        <button id="testCORS">Test CORS Configuration</button>
        
        <h2>Log Output:</h2>
        <div id="logOutput" class="log"></div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const logOutput = document.getElementById('logOutput');
        
        function log(message, isError = false) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toISOString()}] ${message}`;
            entry.className = isError ? 'error' : 'success';
            logOutput.appendChild(entry);
            console.log(message);
        }

        // Initialize AWS SDK
        AWS.config.region = config.region;
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: config.identityPoolId
        });

        const s3 = new AWS.S3();

        // Test AWS Credentials
        document.getElementById('testCredentials').addEventListener('click', async () => {
            try {
                log('Testing AWS credentials...');
                
                await new Promise((resolve, reject) => {
                    AWS.config.credentials.refresh(err => {
                        if (err) {
                            log(`Credential Error: ${err.message}`, true);
                            reject(err);
                        } else {
                            log(`Credentials successfully refreshed`);
                            log(`Identity ID: ${AWS.config.credentials.identityId}`);
                            resolve();
                        }
                    });
                });
            } catch (error) {
                log(`Test failed: ${error.message}`, true);
            }
        });

        // Test S3 Connection
        document.getElementById('testS3').addEventListener('click', async () => {
            try {
                log('Testing S3 connection...');
                
                const params = { Bucket: config.bucketName };
                const data = await s3.listObjects(params).promise();
                
                log(`Successfully connected to S3 bucket: ${config.bucketName}`);
                log(`Found ${data.Contents ? data.Contents.length : 0} objects in the bucket`);
            } catch (error) {
                log(`S3 connection failed: ${error.message}`, true);
                log(`Error code: ${error.code}`, true);
            }
        });

        // Test CORS Configuration
        document.getElementById('testCORS').addEventListener('click', async () => {
            try {
                log('Testing CORS configuration...');
                
                const response = await fetch(`https://${config.bucketName}.s3.amazonaws.com/test-cors.txt`, {
                    method: 'HEAD'
                });
                
                if (response.ok) {
                    log(`CORS is properly configured! Status: ${response.status}`);
                } else {
                    log(`CORS test failed with status: ${response.status}`, true);
                }
            } catch (error) {
                log(`CORS test failed: ${error.message}`, true);
            }
        });

        // Log initial configuration
        log(`Running test on: ${window.location.hostname}`);
        log(`AWS Region: ${AWS.config.region}`);
        log(`S3 Bucket: ${config.bucketName}`);
        log(`Identity Pool: ${config.identityPoolId}`);
    </script>
</body>
</html>
