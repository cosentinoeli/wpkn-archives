<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct S3 Access Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { padding: 10px; margin-top: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Direct S3 Access Test</h1>
        <p>This page tests direct public access to the S3 bucket without using the AWS SDK.</p>
        
        <button id="testPublicAccess">Test Public S3 Access</button>
        <div id="results"></div>
    </div>

    <script>
        const bucket = 'radiorecorderstack-radiorecordings3d118ea0-ypnp78o0qror';
        const resultsDiv = document.getElementById('results');
        
        function addResult(message, isSuccess) {
            const div = document.createElement('div');
            div.className = `result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }
        
        document.getElementById('testPublicAccess').addEventListener('click', async () => {
            addResult('Testing direct access to S3 bucket...', true);
            
            // Try several URL patterns
            const urlPatterns = [
                `https://${bucket}.s3.amazonaws.com/`,
                `https://s3.amazonaws.com/${bucket}/`,
                `https://s3.us-east-1.amazonaws.com/${bucket}/`
            ];
            
            for (const url of urlPatterns) {
                try {
                    addResult(`Testing URL: ${url}`, true);
                    const response = await fetch(url, { method: 'HEAD' });
                    
                    if (response.ok) {
                        addResult(`✅ Successfully accessed ${url}`, true);
                    } else {
                        addResult(`❌ Access failed for ${url}: ${response.status} ${response.statusText}`, false);
                    }
                } catch (error) {
                    addResult(`❌ Error accessing ${url}: ${error.message}`, false);
                }
            }
            
            // Try accessing a sample MP3
            try {
                const sampleUrl = `https://${bucket}.s3.amazonaws.com/recordings/samples/recording_2023-11-15_15-30-00.mp3`;
                addResult(`Testing sample MP3: ${sampleUrl}`, true);
                
                const response = await fetch(sampleUrl, { method: 'HEAD' });
                
                if (response.ok) {
                    addResult(`✅ Sample MP3 accessible! Status: ${response.status}`, true);
                } else {
                    addResult(`❌ Sample MP3 not accessible: ${response.status} ${response.statusText}`, false);
                }
            } catch (error) {
                addResult(`❌ Error accessing sample MP3: ${error.message}`, false);
            }
        });
    </script>
</body>
</html>
