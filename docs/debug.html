<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPKN Archives Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        .log { background: #f4f4f4; padding: 10px; border-radius: 4px; margin: 10px 0; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
        h3 { margin-top: 20px; }
    </style>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1001.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>WPKN Archives Debug Console</h1>
        
        <div>
            <h3>Test AWS Configuration</h3>
            <button id="testCredentials">Test AWS Credentials</button>
            <button id="testBucket">Test S3 Bucket Access</button>
            <button id="listRecordings">List Available Recordings</button>
        </div>
        
        <h3>Console Output:</h3>
        <div id="output" class="log"></div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Output handling
        const outputDiv = document.getElementById('output');
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toISOString()}] ${message}`;
            entry.className = type;
            outputDiv.appendChild(entry);
            console.log(message);
        }
        
        // Initialize AWS SDK
        AWS.config.region = config.region;
        AWS.config.credentials = new AWS.CognitoIdentityCredentials({
            IdentityPoolId: config.identityPoolId
        });
        
        // Log configuration
        log(`Using configuration:`, 'info');
        log(`Region: ${config.region}`, 'info');
        log(`Bucket: ${config.bucketName}`, 'info');
        log(`Identity Pool: ${config.identityPoolId}`, 'info');
        log(`Recordings Prefix: ${config.recordingsPrefix}`, 'info');
        
        // S3 client with debug mode
        const s3 = new AWS.S3(config.s3Options || {});
        
        // Test AWS Credentials
        document.getElementById('testCredentials').addEventListener('click', async () => {
            try {
                log('Testing AWS credentials...', 'info');
                
                await new Promise((resolve, reject) => {
                    AWS.config.credentials.refresh(err => {
                        if (err) {
                            log(`Credential Error: ${err.message}`, 'error');
                            log(`Error code: ${err.code}`, 'error');
                            log(`Error stack: ${err.stack}`, 'error');
                            reject(err);
                        } else {
                            log(`Credentials successfully refreshed`, 'success');
                            log(`Identity ID: ${AWS.config.credentials.identityId}`, 'success');
                            resolve();
                        }
                    });
                });
            } catch (error) {
                log(`Test failed: ${error.message}`, 'error');
            }
        });

        // Test S3 Bucket Access
        document.getElementById('testBucket').addEventListener('click', async () => {
            try {
                log('Testing S3 bucket access...', 'info');
                
                const params = { 
                    Bucket: config.bucketName
                };
                
                const data = await s3.headBucket(params).promise();
                log(`Successfully connected to bucket: ${config.bucketName}`, 'success');
                log(`Response: ${JSON.stringify(data)}`, 'success');
            } catch (error) {
                log(`Bucket access failed: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
                log(`Error stack: ${error.stack}`, 'error');
            }
        });

        // List Available Recordings
        document.getElementById('listRecordings').addEventListener('click', async () => {
            try {
                log('Listing available recordings...', 'info');
                
                // First try recordings/samples/
                log('Trying recordings/samples/ directory...', 'info');
                await listPrefix('recordings/samples/');
                
                // Then try recordings/
                log('Trying recordings/ directory...', 'info');
                await listPrefix('recordings/');
                
                // Try root directory
                log('Trying root directory...', 'info');
                await listPrefix('');
                
                // Try test_recordings directory
                log('Trying test_recordings/ directory...', 'info');
                await listPrefix('test_recordings/');
            } catch (error) {
                log(`Operation failed: ${error.message}`, 'error');
            }
        });
        
        // Helper function to list objects with a specific prefix
        async function listPrefix(prefix) {
            try {
                // Refresh credentials first
                await new Promise((resolve, reject) => {
                    AWS.config.credentials.refresh(err => {
                        if (err) reject(err);
                        else resolve();
                    });
                });
                
                const params = {
                    Bucket: config.bucketName,
                    Prefix: prefix,
                    MaxKeys: 20
                };
                
                const data = await s3.listObjects(params).promise();
                
                if (data.Contents && data.Contents.length > 0) {
                    log(`Found ${data.Contents.length} objects with prefix '${prefix}'`, 'success');
                    data.Contents.forEach(item => {
                        log(`- ${item.Key} (${item.Size} bytes)`, 'success');
                    });
                } else {
                    log(`No objects found with prefix '${prefix}'`, 'info');
                }
                
                return data;
            } catch (error) {
                log(`Failed to list with prefix '${prefix}': ${error.message}`, 'error');
                throw error;
            }
        }
    </script>
</body>
</html>
